<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex,follow">
  <title>Consulta enviada | Fausto Parabrisas</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <style>
    .thanks-wrap{min-height:75vh;display:grid;place-items:center;text-align:center;padding:50px 20px}
    .thanks-card{max-width:620px;background:#f5f6f6;border-radius:14px;padding:48px 34px;box-shadow:0 12px 35px rgba(0,0,0,.08)}
    .thanks-card h1{font-size:clamp(30px,5vw,46px);margin:0 0 15px}
    .thanks-card p{color:#687078;line-height:1.7}
    .thanks-card .btn{margin-top:18px}
  </style>
</head>
<body>
  <main class="thanks-wrap">
    <section class="thanks-card">
      <div class="eyebrow">FAUSTO · SOLUCIONES AUTOMOTRICES</div>
      <h1>¡Gracias por contactarnos!</h1>
      <p>Tu mensaje fue enviado. Si necesitamos más información para responder tu consulta, nos pondremos en contacto contigo.</p>
      <a class="btn btn-orange" href="index.html">Volver a la página principal</a>
    </section>
  </main>
</body>
</html>
